# Python environment for the notebooks in analysis/ (01-07, 23).
# Versions as reported in the thesis Methods.
#   conda env create -f environment.yml
#   conda activate proliftex
name: proliftex
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12.2
  - numpy=1.26.4
  - pandas=2.2.2
  - scipy=1.14.1
  - matplotlib=3.9.2
  - seaborn=0.13.2
  - jupyterlab
  - pip
  - pip:
      - scanpy==1.11.1
      - anndata==0.11.4
      - scvi-tools==1.3.1.post1
